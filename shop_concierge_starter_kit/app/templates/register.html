{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block body %}
{% include "_home_link.html" %}
<h1>Create your shop</h1>
{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
<form method="post" action="/register">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <label>Shop name <input name="shop_name" required maxlength="120" value="{{ values.get('shop_name', '') }}"></label>
  <label>Email <input name="email" type="email" required maxlength="254" value="{{ values.get('email', '') }}"></label>
  <label>Password (10+ characters) <input name="password" type="password" required minlength="10" maxlength="128" autocomplete="new-password"></label>
  <button class="btn" type="submit">Register</button>
</form>
<p>Already registered? <a href="/login">Log in</a></p>
{% endblock %}
