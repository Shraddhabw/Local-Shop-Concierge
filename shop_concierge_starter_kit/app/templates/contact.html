{% extends "base.html" %}
{% block title %}Contact us{% endblock %}
{% block body %}
{% include "_home_link.html" %}
<h1>Contact us</h1>
{% if error %}<div class="flash err" role="alert" aria-live="assertive"><span class="flash-icon" aria-hidden="true">&#9888;</span><span class="flash-text"><span class="sr">Error: </span>{{ error }}</span></div>{% endif %}
<form method="post" action="/contact">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <label>Your name <input name="name" required maxlength="100" value="{{ values.get('name', '') }}"></label>
  <label>Your email <input name="email" type="email" required maxlength="254" value="{{ values.get('email', '') }}"></label>
  <label>Message <textarea name="message" required minlength="10" maxlength="2000">{{ values.get('message', '') }}</textarea></label>
  <div class="hp" aria-hidden="true"><label>Leave this empty <input name="website" tabindex="-1" autocomplete="off"></label></div>
  <button class="btn" type="submit">Send</button>
</form>
{% endblock %}
{% block scripts %}<script src="/static/forms.js" defer></script>{% endblock %}
