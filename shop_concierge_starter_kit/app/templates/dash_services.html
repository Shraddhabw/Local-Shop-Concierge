{% extends "dash_base.html" %}
{% block title %}Services{% endblock %}
{% block content %}
<h1>Services and prices</h1>
<p class="note">Prices are whole numbers in {{ shop.currency }}. Leave the price empty if it depends.</p>
{% for s in services %}
<form method="post" action="/dashboard/services/{{ s.id }}" class="row">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <label>Name <input name="name" value="{{ s.name }}" required maxlength="120"></label>
  <label>Price <input name="price" value="{{ s.price if s.price is not none else '' }}" inputmode="numeric"></label>
  <label>Minutes <input name="duration_min" value="{{ s.duration_min if s.duration_min is not none else '' }}" inputmode="numeric"></label>
  <label>Description <input name="description" value="{{ s.description }}" maxlength="500"></label>
  <label>Keywords <input name="keywords" value="{{ s.keywords }}" maxlength="300"></label>
  <button class="btn small" type="submit">Save</button>
  <button class="link" type="submit" formaction="/dashboard/services/{{ s.id }}/delete">Delete</button>
</form>
{% endfor %}
<h2>Add a service</h2>
<form method="post" action="/dashboard/services" class="row">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <label>Name <input name="name" required maxlength="120"></label>
  <label>Price <input name="price" inputmode="numeric"></label>
  <label>Minutes <input name="duration_min" inputmode="numeric"></label>
  <label>Description <input name="description" maxlength="500"></label>
  <label>Keywords <input name="keywords" maxlength="300"></label>
  <button class="btn" type="submit">Add</button>
</form>
{% endblock %}
